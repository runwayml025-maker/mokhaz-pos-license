<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staxx POS - Secure License Portal</title>
    <!-- Tailwind CSS for modern responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Crypto JS for SHA-256 secure hashing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- LOGIN CONTAINER -->
    <div id="loginCard" class="w-full max-w-md bg-slate-900/85 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-purple-950/30">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 shadow-lg shadow-purple-600/30 mb-4 text-white text-2xl font-bold">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white">ADMIN ACCESS</h1>
            <p class="text-xs sm:text-sm text-slate-400 mt-1">Enter password to unlock Staxx POS Portal</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">Admin Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                        <i class="fa-solid fa-key"></i>
                    </span>
                    <input type="password" id="adminPassword" placeholder="Enter password..." class="w-full pl-11 pr-4 py-3.5 bg-slate-950/60 border border-slate-800 rounded-2xl text-sm text-white placeholder-slate-600 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 transition">
                </div>
            </div>

            <button onclick="checkLogin()" class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold rounded-2xl shadow-lg shadow-purple-600/25 transition duration-200 flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-right-to-bracket"></i> Login Portal
            </button>
            <p id="loginError" class="text-red-400 text-xs text-center font-bold hidden">Galat Password! Dobara koshish karein.</p>
        </div>
    </div>

    <!-- GENERATOR CONTAINER (Initially Hidden) -->
    <div id="generatorCard" class="hidden w-full max-w-md bg-slate-900/85 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-purple-950/30">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 shadow-lg shadow-purple-600/30 mb-4 text-white text-2xl font-bold">
                <i class="fa-solid fa-cash-register"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-white">STAXX POS</h1>
            <p class="text-xs sm:text-sm text-slate-400 mt-1">Enterprise Hardware License Portal</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">Client Machine ID</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                        <i class="fa-solid fa-fingerprint"></i>
                    </span>
                    <input type="text" id="machineId" placeholder="e.g., MKZ-WIN-8942-PRO" class="w-full pl-11 pr-4 py-3.5 bg-slate-950/60 border border-slate-800 rounded-2xl text-sm font-mono text-white placeholder-slate-600 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/20 uppercase transition">
                </div>
            </div>

            <button onclick="generateKey()" class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold rounded-2xl shadow-lg shadow-purple-600/25 transition duration-200 flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-key"></i> Generate License Key
            </button>

            <!-- Result Box -->
            <div class="mt-6 pt-6 border-t border-slate-800/80">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">Generated Secure Key</label>
                <div class="relative flex items-center">
                    <input type="text" id="resultKey" readonly placeholder="Key will appear here..." class="w-full pl-4 pr-14 py-3.5 bg-slate-950 border border-slate-800 rounded-2xl text-emerald-400 font-mono text-xs sm:text-sm font-bold text-center tracking-wider">
                    <button onclick="copyKey()" class="absolute right-2 px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition text-xs flex items-center gap-1 cursor-pointer" title="Copy Key">
                        <i class="fa-solid fa-copy"></i>
                    </button>
                </div>
            </div>

            <button onclick="logout()" class="w-full mt-4 py-2 bg-transparent hover:bg-slate-800 text-slate-500 hover:text-slate-300 text-xs font-bold rounded-xl transition cursor-pointer">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "Momoanddodo";
        // 100% Strict Salt
        const SECRET_SALT = "MOKHAZ_MASTER_2026";

        function checkLogin() {
            let pass = document.getElementById('adminPassword').value;
            let errorMsg = document.getElementById('loginError');

            if(pass === ADMIN_PASSWORD) {
                document.getElementById('loginCard').classList.add('hidden');
                document.getElementById('generatorCard').classList.remove('hidden');
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function logout() {
            document.getElementById('adminPassword').value = '';
            document.getElementById('generatorCard').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
        }

        function generateKey() {
            let mId = document.getElementById('machineId').value.trim();
            if(!mId) {
                alert("Baraye meherbani pehle Machine ID enter karein!");
                return;
            }

            let data = mId.toUpperCase() + SECRET_SALT;
            let hash = CryptoJS.SHA256(data).toString().toUpperCase();
            let rawKey = hash.substring(0, 16);
            let formattedKey = rawKey.match(/.{1,4}/g).join('-');

            document.getElementById('resultKey').value = formattedKey;
        }

        function copyKey() {
            let keyBox = document.getElementById('resultKey');
            if(!keyBox.value) return;
            keyBox.select();
            navigator.clipboard.writeText(keyBox.value);
            alert("License Key clipboard par copy ho gayi!");
        }
    </script>
</body>
</html>
